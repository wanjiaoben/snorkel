<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Okinawa Slideshow Preview</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #080b0d; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 12px; box-sizing: border-box; }
    video { display: block; width: min(100%, 430px); max-height: calc(100vh - 24px); aspect-ratio: 9 / 16; background: #000; object-fit: contain; }
  </style>
</head>
<body>
  <main>
    <video controls playsinline preload="metadata">
      <source src="videos/sns/20260622/slideshow-snorkel-original-music-01.mp4" type="video/mp4">
    </video>
  </main>
</body>
</html>
